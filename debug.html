<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>診斷頁</title>
<style>
  body { font-family: monospace; padding: 20px; background: #f5f7fa; font-size: 14px; }
  h2 { font-size: 16px; margin-bottom: 16px; }
  .row { padding: 10px 14px; margin-bottom: 6px; border-radius: 4px; word-break: break-all; }
  .ok  { background: #e6f7f0; border-left: 4px solid #00a86b; }
  .ng  { background: #fde8ec; border-left: 4px solid #e8294a; }
  .info{ background: #e8f0fe; border-left: 4px solid #0077cc; }
  video { width: 100%; margin-top: 16px; border: 2px solid #0077cc; display: none; }
  canvas { width: 100%; margin-top: 8px; border: 1px solid #ccc; display: none; }
  button { margin-top: 12px; padding: 12px 20px; font-size: 14px;
           background: #0077cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
  #raw { margin-top: 12px; padding: 10px; background: #fffbe6; border: 1px solid #ffe58f;
         min-height: 40px; word-break: break-all; font-size: 13px; }
  #enhanced-wrap { margin-top: 8px; }
  #enhanced-label { font-size: 11px; color: #666; margin-bottom: 4px; }
</style>
</head>
<body>
<h2>📋 iPhone 相機解碼診斷</h2>
<div id="results"></div>

<button onclick="startTest()">▶ 開啟相機測試解碼</button>
<video id="v" playsinline autoplay muted></video>
<div id="raw">掃描結果會顯示在這裡…</div>
<div id="enhanced-wrap">
  <div id="enhanced-label">增強後影像預覽：</div>
  <canvas id="enhanced-canvas"></canvas>
</div>

<script>
const out = document.getElementById('results');
function row(cls, msg) {
  const d = document.createElement('div');
  d.className = 'row ' + cls;
  d.textContent = msg;
  out.appendChild(d);
}

// ── 基礎環境診斷 ────────────────────────────────────────────
row('info', '🌐 URL: ' + location.href);
row('info', '🔒 Protocol: ' + location.protocol);
row('info', '📱 UA: ' + navigator.userAgent);
row(('BarcodeDetector' in window) ? 'ok' : 'ng',
    'BarcodeDetector: ' + ('BarcodeDetector' in window));
row(('ImageCapture' in window) ? 'ok' : 'ng',
    'ImageCapture: ' + ('ImageCapture' in window));
row((navigator.mediaDevices?.getUserMedia) ? 'ok' : 'ng',
    'getUserMedia: ' + !!(navigator.mediaDevices?.getUserMedia));
row((typeof createImageBitmap !== 'undefined') ? 'ok' : 'ng',
    'createImageBitmap: ' + (typeof createImageBitmap !== 'undefined'));

if ('BarcodeDetector' in window) {
  BarcodeDetector.getSupportedFormats().then(fmts => {
    row('ok', '📦 Supported formats: ' + fmts.join(', '));
  }).catch(e => row('ng', 'getSupportedFormats error: ' + e));
}

// ── Image processing (same as app.js) ───────────────────────
function enhanceForBarcode(src) {
  const w = src.width, h = src.height;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const ctx = out.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0);
  const img = ctx.getImageData(0, 0, w, h);
  const d   = img.data;
  const gray = new Uint8ClampedArray(w * h);
  for (let i = 0, p = 0; i < d.length; i += 4, p++)
    gray[p] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  // contrast stretch
  const hist = new Int32Array(256);
  for (let i = 0; i < gray.length; i++) hist[gray[i]]++;
  const total = gray.length;
  let lo = 0, hi = 255, cum = 0;
  for (let v = 0; v < 256; v++) { cum += hist[v]; if (cum < total*0.01) lo = v; }
  cum = 0;
  for (let v = 255; v >= 0; v--) { cum += hist[v]; if (cum < total*0.01) hi = v; }
  const range = Math.max(1, hi - lo);
  for (let i = 0; i < gray.length; i++)
    gray[i] = Math.max(0, Math.min(255, ((gray[i]-lo)/range)*255));
  // unsharp mask
  const blur = new Uint8ClampedArray(gray.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0;
    const kern = [1,2,1,2,4,2,1,2,1];
    for (let ky=-1;ky<=1;ky++) for (let kx=-1;kx<=1;kx++) {
      s += gray[Math.min(h-1,Math.max(0,y+ky))*w+Math.min(w-1,Math.max(0,x+kx))]
           * kern[(ky+1)*3+(kx+1)];
    }
    blur[y*w+x] = s/16;
  }
  for (let i=0; i<gray.length; i++)
    gray[i] = Math.max(0, Math.min(255, gray[i] + 1.8*(gray[i]-blur[i])));
  for (let i=0,p=0; i<d.length; i+=4,p++) d[i]=d[i+1]=d[i+2]=gray[p], d[i+3]=255;
  ctx.putImageData(img, 0, 0);
  return out;
}

// ── Camera test ──────────────────────────────────────────────
let running = false;
async function startTest() {
  if (running) return;
  running = true;
  const video    = document.getElementById('v');
  const rawDiv   = document.getElementById('raw');
  const enhCanvas = document.getElementById('enhanced-canvas');
  document.getElementById('enhanced-wrap').style.display = 'block';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    video.style.display = 'block';
    await video.play();
    row('ok', '✅ 相機啟動成功');

    const hasBD = 'BarcodeDetector' in window;
    row(hasBD ? 'ok' : 'ng', '解碼引擎：' + (hasBD ? 'BarcodeDetector ✅' : 'BarcodeDetector ❌ — 無法解碼'));

    if (!hasBD) {
      rawDiv.textContent = '❌ 此裝置不支援 BarcodeDetector，無法在網頁內解碼雷射條碼。';
      return;
    }

    const detector  = new BarcodeDetector({ formats: ['qr_code','code_128','code_39','data_matrix','pdf417','aztec'] });
    const offscreen = document.createElement('canvas');
    const ctx       = offscreen.getContext('2d', { willReadFrequently: true });
    let frameN = 0;

    const tick = async () => {
      if (!running) return;
      frameN++;

      if (video.readyState >= video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
        offscreen.width  = video.videoWidth;
        offscreen.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);

        // Show enhanced preview every 10 frames
        if (frameN % 10 === 0) {
          const enh = enhanceForBarcode(offscreen);
          enhCanvas.width  = enh.width;
          enhCanvas.height = enh.height;
          enhCanvas.style.display = 'block';
          enhCanvas.getContext('2d').drawImage(enh, 0, 0);
        }

        // Try raw
        try {
          let codes = await detector.detect(offscreen);
          if (codes.length > 0) {
            rawDiv.innerHTML = '✅ <b>原始解碼成功：</b><br>' + codes.map(c =>
              `format=${c.format} value=[${c.rawValue}] len=${c.rawValue.length}`).join('<br>');
            requestAnimationFrame(tick); return;
          }
        } catch(e) { rawDiv.textContent = 'detect error: ' + e; }

        // Try enhanced
        try {
          const enhanced = enhanceForBarcode(offscreen);
          const codes2   = await detector.detect(enhanced);
          if (codes2.length > 0) {
            rawDiv.innerHTML = '✅ <b>增強後解碼成功：</b><br>' + codes2.map(c =>
              `format=${c.format} value=[${c.rawValue}] len=${c.rawValue.length}`).join('<br>');
            requestAnimationFrame(tick); return;
          }
        } catch(e) {}

        if (frameN % 30 === 0) rawDiv.textContent = `⏳ 偵測中… 第 ${frameN} 幀`;
      }
      requestAnimationFrame(tick);
    };
    tick();

  } catch(e) {
    row('ng', '❌ 相機錯誤：' + e.message);
    running = false;
  }
}
</script>
</body>
</html>
